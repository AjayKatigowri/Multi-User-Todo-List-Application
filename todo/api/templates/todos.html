<!DOCTYPE html>
<html>
<head>
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand">Todo App</span>
            <a href="{% url 'logout' %}" class="btn btn-sm btn-light">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">My Todos</h2>

        <form method="post" action="{% url 'add_todo' %}" class="mb-4">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="title" class="form-control" placeholder="Add a new todo..." required>
                <button class="btn btn-primary" type="submit">Add</button>
            </div>
        </form>

        <div class="list-group">
            {% for todo in todos %}
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0">{{ todo.title }}</h5>
                            <small class="text-muted">{{ todo.created_at|date:"M d, Y" }}</small>
                        </div>
                        <div>
                            <form method="post" action="{% url 'toggle_todo' todo.id %}" style="display:inline;">
                                {% csrf_token %}
                                <button class="btn btn-sm btn-success">
                                    {% if todo.completed %}Undo{% else %}Done{% endif %}
                                </button>
                            </form>
                            <form method="post" action="{% url 'delete_todo' todo.id %}" style="display:inline;">
                                {% csrf_token %}
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            {% empty %}
                <p class="text-muted">No todos yet. Add one to get started!</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
